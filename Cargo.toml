[workspace]
resolver = "3"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/ufoplay/totally_open_games"

[workspace.dependencies]
aeron = { path = "crates/aeron" }
imuse = { path = "crates/imuse" }
landru = { path = "crates/landru" }

[workspace.lints.rust]
unsafe_code = "forbid"
