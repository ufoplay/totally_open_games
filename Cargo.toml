[workspace]
resolver = "3"
members = ["crates/*", "bin/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/ufoplay/totally_open_games"

[workspace.dependencies]
aeron = { path = "crates/aeron" }
imuse = { path = "crates/imuse" }
landru = { path = "crates/landru" }

anyhow = "1"
bitflags = "2"
rtrb = "0.4"
rustysynth = "1.3"
saphyr-parser = "0.1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
toml_edit = "0.25"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# The upstream snapshot analysed on 2026-10-10 (PLAN §0), keyed by repository name. It is the reference commit of a
# crate until the crate pins its own `[package.metadata.upstream] commit` (PLAN §9 #12).
